<!doctype html><html><body style="background:#222;margin:0">
<canvas id="c" width="768" height="640" style="image-rendering:pixelated;width:1536px;height:1280px"></canvas>
<script type="module">
import { townCanvas, drawSea, BUILDINGS, SPOTS, NPCS } from '/src/client/gfx/town.ts';
import { drawTrainer, drawNpc } from '/src/client/gfx/trainers.ts';
const c = document.getElementById('c'), x = c.getContext('2d');
x.imageSmoothingEnabled = false;
x.drawImage(townCanvas(), 0, 0);
drawSea(x, 0, 0, 768);
drawTrainer(x, 'ash', 168, 214, 0, 0);
drawTrainer(x, 'misty', 390, 300, 1, 1);
drawNpc(x, 'oak', NPCS.oak.look, NPCS.oak.x, NPCS.oak.y, 0);
drawNpc(x, 'karp', NPCS.karp.look, NPCS.karp.x, NPCS.karp.y, 0);
x.strokeStyle = 'rgba(255,0,0,.6)';
for (const s of SPOTS) x.strokeRect(s.x + .5, s.y + .5, s.w, s.h);
document.title = 'ready';
</script></body></html>
